<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="fraTitle">
  <title id="fraTitle">Ilustração representando o curso de francês, com a silhueta da Torre Eiffel e uma faixa nas cores da bandeira francesa</title>
  <rect width="400" height="240" fill="#EFEFF7"/>
  <rect y="200" width="400" height="40" fill="#22223B"/>
  <!-- silhueta Torre Eiffel -->
  <g fill="#22223B">
    <polygon points="200,20 214,110 235,110 210,140 225,200 200,175 175,200 190,140 165,110 186,110"/>
    <rect x="150" y="200" width="100" height="8"/>
  </g>
  <!-- faixa bandeira -->
  <rect x="0" y="0" width="133" height="30" fill="#1B2A4A"/>
  <rect x="133" y="0" width="134" height="30" fill="#FFFFFF"/>
  <rect x="267" y="0" width="133" height="30" fill="#E63946"/>
</svg>

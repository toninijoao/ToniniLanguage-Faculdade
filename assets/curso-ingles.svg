<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="ingTitle">
  <title id="ingTitle">Ilustração representando o curso de inglês, com a silhueta do Big Ben e uma faixa nas cores da bandeira britânica</title>
  <rect width="400" height="240" fill="#EAF1FB"/>
  <rect y="200" width="400" height="40" fill="#1B2A4A"/>
  <!-- silhueta Big Ben -->
  <g fill="#1B2A4A">
    <rect x="175" y="60" width="50" height="140"/>
    <rect x="165" y="40" width="70" height="24" rx="3"/>
    <polygon points="165,40 200,10 235,40"/>
    <circle cx="200" cy="90" r="16" fill="#EAF1FB"/>
    <circle cx="200" cy="90" r="16" fill="none" stroke="#1B2A4A" stroke-width="4"/>
  </g>
  <!-- faixa bandeira -->
  <rect x="0" y="0" width="400" height="14" fill="#E63946"/>
  <rect x="0" y="14" width="400" height="6" fill="#FFFFFF"/>
  <rect x="0" y="20" width="400" height="10" fill="#1B2A4A"/>
</svg>

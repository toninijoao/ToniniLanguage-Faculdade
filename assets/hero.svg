<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Ilustração de um globo terrestre cercado por balões de fala com saudações em inglês, italiano e francês</title>
  <circle cx="240" cy="220" r="120" fill="#EAF1FB"/>
  <circle cx="240" cy="220" r="95" fill="#1B2A4A"/>
  <path d="M240 125a95 95 0 0 1 0 190 240 240 0 0 1 0-190z" fill="#26375E"/>
  <path d="M150 170c30-20 150-20 180 0" stroke="#EAF1FB" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M148 270c30 20 154 20 184 0" stroke="#EAF1FB" stroke-width="4" fill="none" opacity="0.5"/>
  <line x1="145" y1="220" x2="335" y2="220" stroke="#EAF1FB" stroke-width="4" opacity="0.5"/>

  <!-- Balão de fala - inglês -->
  <g transform="translate(30,40)">
    <rect x="0" y="0" width="120" height="56" rx="16" fill="#F4A300"/>
    <polygon points="20,56 34,56 18,74" fill="#F4A300"/>
    <text x="60" y="34" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A" text-anchor="middle">Hello!</text>
  </g>

  <!-- Balão de fala - italiano -->
  <g transform="translate(330,60)">
    <rect x="0" y="0" width="120" height="56" rx="16" fill="#E63946"/>
    <polygon points="100,56 114,56 118,74" fill="#E63946"/>
    <text x="60" y="34" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ciao!</text>
  </g>

  <!-- Balão de fala - francês -->
  <g transform="translate(180,300)">
    <rect x="0" y="0" width="140" height="56" rx="16" fill="#2A9D8F"/>
    <polygon points="55,0 69,0 60,-18" fill="#2A9D8F"/>
    <text x="70" y="34" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bonjour!</text>
  </g>

  <!-- Livro na base -->
  <g transform="translate(190,330)">
    <path d="M0 20 L50 5 L50 45 L0 60 Z" fill="#F4A300"/>
    <path d="M100 20 L50 5 L50 45 L100 60 Z" fill="#E63946"/>
  </g>
</svg>
